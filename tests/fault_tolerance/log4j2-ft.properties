# Driver logging for the fault-tolerance test. The job calls setLogLevel("WARN"),
# which only changes the root logger; the loggers below keep INFO so executor
# and task events (added, lost, re-run, which host) stay in the log.
rootLogger.level = info
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %p %c{1}: %m%n

logger.client.name = org.apache.spark.deploy.client
logger.client.level = info
logger.scheduler.name = org.apache.spark.scheduler
logger.scheduler.level = info
logger.storage.name = org.apache.spark.storage.BlockManagerMasterEndpoint
logger.storage.level = info
